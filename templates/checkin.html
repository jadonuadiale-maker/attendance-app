{% extends "base.html" %}
{% block title %}Check-In{% endblock %}

{% block content %}
<h1 class="mb-4">User Check-In</h1>

<input type="hidden" id="session-id" value="{{ session_id }}">

<!-- Autocomplete input -->
<input id="user-search" class="form-control" placeholder="Type your name">

<!-- Autocomplete results -->
<ul id="results" class="list-group mt-2"></ul>

<hr>

<!-- Alphabetical list -->
<h4>All Members</h4>
<ul class="list-group">
    {% for user in users %}
        <li class="list-group-item">
            <div class="card p-2">
                <a class="fw-bold"
                   href="{{ url_for('sessions.checkin_detail', user_id=user.id, session_id=session_id) }}">
                    {{ user.full_name }}
                </a>
            </div>
        </li>
    {% endfor %}
</ul>

<!-- First timer -->
<div class="mt-4 text-end">
    <a href="{{ url_for('users.first_timer', session_id=session_id) }}" class="btn btn-warning">
        First Timer
    </a>
</div>
{% endblock %}

{% block scripts %}
<script>
let debounceTimer;

document.getElementById("user-search").addEventListener("keyup", (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
        const q = e.target.value;
        const list = document.getElementById("results");
        list.innerHTML = "";

        if (!q) return;

        const groupId = Number("{{ session.classgroup_id }}");
        const res = await fetch(`/users/search_by_group?q=${encodeURIComponent(q)}&group_id=${groupId}`);
        const users = await res.json();

        users.forEach(u => {
            const li = document.createElement("li");
            li.className = "list-group-item";
            li.innerHTML = `
                <div class="card p-2">
                    <a class="fw-bold" href="/checkin/${u.id}/${document.getElementById('session-id').value}">
                        ${u.full_name}
                    </a>
                </div>
            `;
            list.appendChild(li);
        });
    }, 300); // 300ms delay
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Check-In{% endblock %}

{% block content %}
<h1 class="mb-4">User Check-In</h1>

<input type="hidden" id="session-id" value="{{ session_id }}">

<!-- Search Card -->
<div class="card p-3 mb-4">
    <h5 class="mb-3">Search for Your Name</h5>

    <input id="user-search" class="form-control mb-3" placeholder="Type your name">

    <!-- Autocomplete results -->
    <ul id="results" class="list-group"></ul>
</div>

<!-- Alphabetical List -->
<div class="card p-3 mb-4">
    <h5 class="mb-3">All Members</h5>

    <ul class="list-group">
        {% for user in users %}
            <li class="list-group-item p-0">
                <a class="d-block p-2 fw-bold text-decoration-none text-primary"
                   href="{{ url_for('sessions.checkin_detail', user_id=user.id, session_id=session_id) }}">
                    {{ user.full_name }}
                </a>
            </li>
        {% endfor %}
    </ul>
</div>

<!-- First Timer -->
<div class="text-end">
    <a href="{{ url_for('users.first_timer', session_id=session_id) }}" class="btn btn-warning btn-lg">
        First Timer Registration
    </a>
</div>
{% endblock %}

{% block scripts %}
<script>
let debounceTimer;

document.getElementById("user-search").addEventListener("keyup", (e) => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
        const q = e.target.value;
        const list = document.getElementById("results");
        list.innerHTML = "";

        if (!q) return;

        const groupId = Number("{{ session.classgroup_id }}");
        const res = await fetch(`/users/search_by_group?q=${encodeURIComponent(q)}&group_id=${groupId}`);
        const users = await res.json();

        users.forEach(u => {
            const li = document.createElement("li");
            li.className = "list-group-item p-0";
            li.innerHTML = `
                <a class="d-block p-2 fw-bold text-decoration-none text-primary"
                   href="/checkin/${u.id}/${document.getElementById('session-id').value}">
                    ${u.full_name}
                </a>
            `;
            list.appendChild(li);
        });
    }, 300);
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Check-In{% endblock %}

{% block content %}
<h1 class="mb-4">User Check-In</h1>

<input type="hidden" id="session-id" value="{{ session_id }}">

<!-- Autocomplete input -->
<input id="user-search" class="form-control" placeholder="Type your name">

<!-- Autocomplete results -->
<ul id="results" class="list-group mt-2"></ul>

<hr>

<!-- Alphabetical list -->
<h4>All Members</h4>
<ul class="list-group">
    {% for user in users %}
        <li class="list-group-item">
            <a href="{{ url_for('sessions.checkin_detail', user_id=user.id, session_id=session_id) }}">
                {{ user.full_name }}
            </a>
        </li>
    {% endfor %}
</ul>

<!-- First timer -->
<div class="mt-4 text-end">
    <a href="{{ url_for('users.first_timer', session_id=session_id) }}" class="btn btn-warning">
        First Timer
    </a>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById("user-search").addEventListener("keyup", async (e) => {
    const q = e.target.value;
    if (!q) return;

    const res = await fetch(`/users/search?q=${q}`);
    const users = await res.json();

    const list = document.getElementById("results");
    list.innerHTML = "";

    users.forEach(u => {
        const li = document.createElement("li");
        li.className = "list-group-item";
        li.innerHTML = `<a href="/checkin/${u.id}/${document.getElementById('session-id').value}">${u.full_name}</a>`;
        list.appendChild(li);
    });
});
</script>
{% endblock %}

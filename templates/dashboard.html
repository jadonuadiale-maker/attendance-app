{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<!-- Page heading -->
<h1 class="mb-4">Dashboard</h1>

<!-- Dashboard cards row -->
 <div class="row">

    <!-- Users card -->
     <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Users</h5>
                <p class="card-text">Manage all registered users.</p>
                <a href="{{ url_for('users') }}" class="btn btn-primary">View Users</a>
            </div>
        </div>
     </div>

     <!-- Classes card -->
      <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Classes</h5>
                <p class="card-text">View and manage class groups.</p>
                <a href="{{ url_for('classgroups.index') }}" class="btn btn-primary">View Classes</a>
            </div>
        </div>
      </div>

      <!-- Attendance card -->
       <div class="col-md-4">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Attendance</h5>
                <p class="card-text">Track attendance records.</p>
                <a href="{{ url_for('attendance') }}" class="btn btn-primary">View Attendance</a>
            </div>
        </div>
       </div>

 </div>
{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta + responsive viewport -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title block -->
    <title>{% block title %}Attendance App{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Optional page-specific head content -->
    {% block head %}{% endblock %}
</head>
<body class="bg-light">

    <!-- Global Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-success-subtle px-3 mb-4">
        <!-- App brand -->
        <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
            Attendance App
        </a>

        <!-- Navigation links -->
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('users') }}">Users</a>
            <a class="nav-link" href="{{ url_for('classgroups.classes') }}">Classes</a>
            <a class="nav-link" href="{{ url_for('sessions.sessions') }}">Sessions</a>
            <a class="nav-link" href="{{ url_for('attendance') }}">Attendance</a>
            <a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a>
        </div>
    </nav>

    <!-- Main Content container -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer block-->
    <footer class="text-center mt-5 mb-3 text-muted">
        {% block footer %}
        <small>Attendance App © 2026</small>
        {% endblock %}
    </footer>

    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Optional page-specific scripts -->
    {% block scripts %}{% endblock %}
</body>
</html>

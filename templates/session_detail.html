{% extends "base.html" %}
{% block title %}Session Details{% endblock %}

{% block content %}
<h1>Session Details</h1>

<table class="table table-bordered">
  <tr><th>Class Group</th><td>{{ session.classgroup_id }}</td></tr>
  <tr><th>Date</th><td>{{ session.date }}</td></tr>
  <tr><th>Topic</th><td>{{ session.topic }}</td></tr>
  <tr><th>Description</th><td>{{ session.description or "No description provided" }}</td></tr>
</table>

<a href="{{ url_for('sessions.sessions') }}" class="btn btn-secondary">Back to Sessions</a>
{% endblock %}

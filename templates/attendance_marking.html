{% extends "base.html" %}
{% block title %}Mark Attendance{% endblock %}

{% block content %}
<h2>Attendance for {{ session.topic }} ({{ session.date }})</h2>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>User</th>
            <th>Service</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        {% for r in records %}
        <tr>
            <td>{{ r.user.full_name }}</td>
            <td>{{ r.service_number }}</td>
            <td>{{ r.status }}</td>
            <td>
                <form action="{{ url_for('sessions.override_attendance', record_id=r.id) }}" method="POST">
                    <select name="status" class="form-select form-select-sm">
                        <option value="present">Present</option>
                        <option value="absent">Absent</option>
                        <option value="late">Late</option>
                    </select>
                    <button class="btn btn-sm btn-primary mt-1">Update</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

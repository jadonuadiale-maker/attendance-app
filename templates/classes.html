{% extends "base.html" %}

{% block title %}Class Groups{% endblock %}

{% block content %}
<h1 class="mb-4">Class Groups</h1>

<!-- Add Class Group form -->
{% if session.role == "admin" %}
<form action="{{ url_for('classgroups.create_classgroup_html') }}" method="POST" class="mb-4">
  <div class="input-group">
    <input type="text" name="name" class="form-control" placeholder="Enter class group name" required>
    <button class="btn btn-success" type="submit">Add Class Group</button>
  </div>
</form>
{% endif %}

<!-- Class Groups table -->
<table class="table table-striped table-bordered">
  <thead class="table-success">
    <tr>
      <th>Name</th>
      <th style="width: 120px;">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for group in groups %}
    <tr>
      <td>{{ group.name }}</td>
      <td>
        <form action="{{ url_for('classgroups.delete_classgroup', id=group.id) }}" method="POST">
          <button class="btn btn-danger btn-sm">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}

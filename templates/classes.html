{% extends "base.html" %}
{% block title %}Classes{% endblock %}

{% block content %}
<h1 class="mb-4">Class Groups</h1>

<!-- Add Class Group Card -->
<div class="card mb-4 p-3">
    <h5 class="mb-3">Add New Class Group</h5>

    <form action="{{ url_for('classgroups.create_classgroup_html') }}" method="POST">
        <div class="row g-3">
            <div class="col-md-12">
                <label class="form-label">Group Name</label>
                <input name="name" class="form-control" required>
            </div>
        </div>

        <button class="btn btn-primary mt-3 w-100">Add Class Group</button>
    </form>
</div>

<!-- Class Groups Table -->
<div class="card p-3">
    <h5 class="mb-3">Registered Class Groups</h5>

    <div class="table-responsive">
        <table class="table table-striped table-bordered classgroups-table">
            <thead class="table-success">
                <tr>
                    <th>Name</th>
                    <th style="width: 120px;">Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for group in groups %}
                <tr>
                    <td>{{ group.name }}</td>
                    <td>
                        <form action="{{ url_for('classgroups.delete_classgroup', id=group.id) }}" method="POST">
                            <button class="btn btn-danger btn-sm w-100"
                                    onclick="return confirm('Delete this class group?');">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

{% endblock %}

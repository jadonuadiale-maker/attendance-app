{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}
<!-- Page heading -->
 <h1 class="mb-4">Users</h1>

<!-- Add User form -->
 <form action="{{ url_for('users.submit_first_timer') }}" method="POST">
    <input type="hidden" name="session_id" value="{{ session_id }}">

    <input name="first_name" class="form-control mb-2" placeholder="First Name" required>
    <input name="surname" class="form-control mb-2" placeholder="Surname" required>
    <input name="date_of_birth" type="date" class="form-control mb-2">

    <label>Select Service:</label>
    <select name="service_number" class="form-select mb-3">
        <option value="1">1st Service</option>
        <option value="2">2nd Service</option>
        <option value="3">Both</option>
    </select>

    <button class="btn btn-warning mb-4">Submit</button>
</form>

 <!-- Users table -->
  <table class="table table-striped table-bordered">
    <thead class="table-success">
        <tr>
            <th>Name</th>
            <th style="width: 120px;">Actions</th>
        </tr>
    </thead>

    <tbody>
        <!-- Loop through all users -->
         {% for user in users %}
         <tr>
            <td> {{ user.full_name }} </td>
            <td>
                <!-- Delete user form -->
                 <form action="{{ url_for('delete_user', id=user.id) }}" method="POST">
                    <button class="btn btn-danger btn-sm">Delete</button>
                 </form>
            </td>
         </tr>
         {% endfor %}
    </tbody>
  </table>
  {% endblock %}

{% extends "base.html" %}

{% block title %}Attendance Records{% endblock %}

{% block content %}
<!-- Page heading -->
<h1 class="mb-4">Attendance Records</h1>

<!-- Attendance table -->
<table class="table table-striped table-bordered">
    <thead class="table-success">
        <tr>
            <th>User</th>
            <th>Session</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody>
        <!-- Loop through attendance records -->
        {% for record in records %}
        <tr>
            <!-- Display related user, session, and date -->
            <td>{{ record.user.name }}</td>
            <td>{{ record.session.topic }}</td>
            <td>{{ record.date }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

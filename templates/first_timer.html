{% extends "base.html" %}
{% block title %}First Timer{% endblock %}

{% block content %}
<h1 class="mb-4">First Timer Registration</h1>

<div class="card p-3 mb-4">
    <h5 class="mb-3">Register New First Timer</h5>

    <form action="{{ url_for('users.submit_first_timer') }}" method="POST">
        <input type="hidden" name="session_id" value="{{ session_id }}">

        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">First Name</label>
                <input name="first_name" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Surname</label>
                <input name="surname" class="form-control" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Date of Birth</label>
                <input name="date_of_birth" type="date" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input name="email" type="email" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label">Phone Number</label>
                <input name="phone_number" class="form-control">
            </div>
        </div>

        <div class="form-check mt-3">
            <input class="form-check-input" type="checkbox" name="consent_given" required>
            <label class="form-check-label">I consent to my data being stored for attendance purposes.</label>
        </div>

        <label class="form-label mt-3">Select Service</label>
        <select name="service_number" class="form-select mb-3">
            <option value="1">1st Service</option>
            <option value="2">2nd Service</option>
            <option value="3">Both</option>
        </select>

        <button class="btn btn-warning w-100">Submit Registration</button>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}First Timer{% endblock %}

{% block content %}
<h2>First Timer Registration</h2>

<form action="{{ url_for('users.submit_first_timer') }}" method="POST">
    <input type="hidden" name="session_id" value="{{ session_id }}">

    <input name="first_name" class="form-control mb-2" placeholder="First Name" required>
    <input name="surname" class="form-control mb-2" placeholder="Surname" required>
    <input name="date_of_birth" type="date" class="form-control mb-2">

    <select name="gender" class="form-select mb-2">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>

    <input name="email" type="email" class="form-control mb-2" placeholder="Email">

    <input name="phone_number" class="form-control mb-2" placeholder="Phone Number">

    <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" name="consent_given" required>
        <label class="form-check-label">I consent to my data being stored for attendance purposes.</label>
    </div>

    <label>Select Service:</label>
    <select name="service_number" class="form-select mb-3">
        <option value="1">1st Service</option>
        <option value="2">2nd Service</option>
        <option value="3">Both</option>
    </select>

    <button class="btn btn-warning">Submit</button>
</form>
{% endblock %}
